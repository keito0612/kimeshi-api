version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    ports:
      - "8787:8787"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=8787
    env_file:
      - .env
    command: bun run dev
